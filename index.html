*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:#eee;font:17px/1.55 var(--f-body);overflow:hidden;padding:calc(2.5vw + env(safe-area-inset-top,0px)) clamp(7rem,10.5vw,9.5rem) 2.5vw 2.5vw}
a{color:inherit}:focus-visible{outline:2px solid var(--o);outline-offset:3px}[hidden]{display:none!important}
.book{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr 44px 1fr;height:100%;perspective:2600px;filter:drop-shadow(0 30px 50px #000)}
.spiral{display:flex;flex-direction:column;justify-content:space-around;align-items:center;z-index:3;margin:0 -1px;padding:2.5rem 0}.spiral i{display:block;width:44px;height:28px;background:var(--spv) center/contain no-repeat}
.book.solo{grid-template-columns:1fr}.book.solo .l,.book.solo .spiral{display:none}
.pg{position:relative;padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:0}.sc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2.4rem 2.8rem 4.4rem;position:relative;}
.l{--paper:#0d0d0d;--ink:#F2F2EF;--mut:#a5a5a0;--line:#383838;background:var(--paper);color:var(--ink);border-radius:6px 0 0 6px;box-shadow:inset -40px 0 50px -40px #000}
.r{--paper:#F3F3F0;--ink:#111;--mut:#55554f;--line:#cdcdc8;background:var(--paper);color:var(--ink);border-radius:0 12px 12px 0;transform-origin:left center;box-shadow:inset 40px 0 50px -40px rgba(0,0,0,.45);transition:background .6s,color .6s;will-change:transform}
.r[data-theme=dark]{--paper:#0d0d0d;--ink:#F2F2EF;--mut:#a8a8a3;--line:#383838}
.r[data-theme=orange]{--paper:var(--o);--ink:#120a05;--mut:#3a1d0e;--line:#120a05;border-radius:12px;box-shadow:none}
h1{font:400 clamp(3rem,6.2vw,6rem)/.9 var(--f-head);margin:0 0 1.2rem;position:relative}
h2{font:400 2rem/1.1 var(--f-head);margin:0 0 .6rem}h3{font:400 1.4rem var(--f-head);margin:0}
.lede{font-size:1.2rem;font-style:italic;max-width:27em;color:var(--mut);position:relative;margin:0}.l .lede{color:#b8b8b3}
.folio{position:absolute;bottom:1.3rem;font:400 1rem var(--f-head);letter-spacing:.1em;color:var(--mut)}.l .folio{left:2.5rem}.r .folio{right:2.5rem}
.dots{position:absolute;inset:0;pointer-events:none;overflow:hidden}.dot{position:absolute;color:var(--o);font:400 1em var(--f-head);line-height:1;transition:transform .4s ease-out;will-change:transform}
.btn{display:inline-block;margin-top:1.3rem;padding:.6rem 1.3rem;border:2px solid var(--ink);font:400 1.1rem var(--f-head);letter-spacing:.08em;text-decoration:none;position:relative;background:none;color:var(--ink);cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.btn:hover{background:var(--o);border-color:var(--o);color:#111}.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.bw{position:relative;max-width:1240px;height:100%;margin:0 auto}.bw .book{position:relative;z-index:2}
.tabs{position:absolute;left:100%;top:9%;margin-left:-12px;display:flex;flex-direction:column;gap:9px;z-index:1}
.tabs a{--c:#F3F3F0;display:block;padding:.6rem 2rem .6rem 1.5rem;background:var(--c);color:#111;font:400 1.1rem var(--f-head);letter-spacing:.05em;text-decoration:none;white-space:nowrap;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%);transform:translateX(-6px);transform-origin:left center;filter:brightness(.78);transition:transform .4s cubic-bezier(.2,.9,.3,1),filter .3s;animation:tin .8s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--i)*.07s)}
.tabs a:nth-child(7n+1){--c:#FF5A1F}.tabs a:nth-child(7n+2){--c:#F3F3F0}.tabs a:nth-child(7n+3){--c:#e8c07d}.tabs a:nth-child(7n+4){--c:#9cc3b5}.tabs a:nth-child(7n+5){--c:#d98ca0}.tabs a:nth-child(7n+6){--c:#a9b4e0}.tabs a:nth-child(2n){padding-right:2.7rem}
.tabs a:hover{transform:translateX(8px) rotate(-1.5deg);filter:none}.tabs a[aria-current]{transform:translateX(16px);filter:none;font-size:1.2rem}
@keyframes tin{from{transform:translateX(-130px)}}
.edge{position:absolute;top:50%;z-index:6;display:flex;align-items:center;gap:.5rem;height:3.2rem;padding:0 1.1rem;border:0;border-radius:2rem;background:var(--o);color:#111;font:400 1.05rem var(--f-head);letter-spacing:.06em;cursor:pointer;opacity:0;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.3,1)}
.edge.pv{left:.7rem;transform:translate(-130%,-50%)}.edge.nx{right:1.6rem;transform:translate(150%,-50%)}
.pg:hover .edge,.edge:focus-visible{opacity:1}.pg:hover .edge.pv,.pg:hover .edge.nx,.edge:focus-visible{transform:translate(0,-50%)}
.edge span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .35s}.edge:hover span,.edge:focus-visible span{max-width:6.5rem}
